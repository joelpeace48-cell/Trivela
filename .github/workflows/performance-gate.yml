name: Performance Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  load-test:
    name: Load Test with k6
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Soroban dropped support for wasm32-unknown-unknown on Rust 1.82+;
          # wasm32v1-none is the supported target (see contracts-ci.yml).
          targets: wasm32v1-none

      - name: Install dependencies
        run: npm ci

      # Disabled: there is no root "start" script (only per-workspace
      # build:backend/build:frontend), and tests/load/api-load-test.js
      # doesn't exist — the actual k6 scenarios live under
      # load-tests/scenarios/*.js (see load-test.yml, which references them
      # correctly). This job has never run successfully; needs a real
      # start command and the correct scenario path before re-enabling.
      - name: Start application
        if: false
        run: |
          npm run build
          npm start &
          sleep 10
        env:
          NODE_ENV: test

      - name: Run k6 load tests
        if: false
        uses: grafana/k6-action@v0.3.0
        with:
          filename: tests/load/api-load-test.js
        env:
          K6_CLOUD_PROJECT_ID: ${{ secrets.K6_CLOUD_PROJECT_ID }}

      - name: Check thresholds
        if: false
        run: |
          echo "Load test completed. Checking thresholds..."
          # k6 will exit with non-zero code if thresholds fail
